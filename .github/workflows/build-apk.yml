name: Build ScriptSeVideo APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract source ZIP
        run: |
          ZIP_FILE="./ScriptSeVideo-Free-CloudBuild-Kit (1).zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Cloud Build ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .
      - name: Build APK
        run: gradle -p ScriptSeVideo-Free :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScriptSeVideo-APK
          path: ScriptSeVideo-Free/app/build/outputs/apk/debug/app-debug.apk
